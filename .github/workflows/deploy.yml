name: Deploy Pysgrid Forex

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pysgrid-forex-production
  cancel-in-progress: true

env:
  ORACLE_HOST: 140.245.226.102
  ORACLE_USER: ubuntu
  ORACLE_PORT: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m pysgrid_forex.main --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes             -i ~/.ssh/oracle_key -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" '
              set -e
              if [ ! -d /opt/pysgrid-forex/.git ]; then
                sudo mkdir -p /opt/pysgrid-forex
                sudo chown -R ubuntu:ubuntu /opt/pysgrid-forex
                git clone https://github.com/zahidshaikmohammed-cmyk/pysgrid-forex.git /opt/pysgrid-forex
              else
                cd /opt/pysgrid-forex
                git fetch origin main
                git reset --hard origin/main
              fi
              cd /opt/pysgrid-forex
              bash deploy/install.sh

                        echo "Waiting for FastAPI health endpoint..."
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
                  echo
                  echo "Health endpoint passed on attempt $attempt."
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  echo "Health endpoint failed after 60 seconds."
                  sudo systemctl --no-pager --full status pysgrid-forex || true
                  sudo journalctl -u pysgrid-forex -n 120 --no-pager || true
                  exit 1
                fi
                sleep 2
              done

              # From here down this is FEED HEALTH REPORTING, not a deploy
              # gate: the code has already started successfully above (that
              # was the real deploy-correctness check). Whether the
              # *provider* is currently delivering genuine M1 is a separate,
              # ongoing operational question -- if it fails, that is
              # RealMarketAPI'"'"'s plan/endpoint, not this deploy, and a
              # deploy of a *safety fix* must still be allowed to ship even
              # while the provider is misbehaving. Blocking it here would
              # leave the previous, less-safe code running in production
              # indefinitely with no way to ever replace it. So: report
              # loudly, never exit 1 for this.
              m1_ok=false
              echo "Checking whether every configured symbol currently has a validated M1 feed (informational, not a deploy gate)..."
              for attempt in $(seq 1 30); do
                health=$(curl --fail --silent --show-error http://127.0.0.1:8080/health)
                all_live=$(printf '%s' "$health" | grep -o "\"all_m1_live\":[a-z]*" | cut -d: -f2)
                if [ "$all_live" = "true" ]; then
                  m1_ok=true
                  echo "$health"
                  echo "Every configured symbol has a validated live M1 feed on attempt $attempt."
                  break
                fi
                sleep 2
              done

              if [ "$m1_ok" = "false" ]; then
                echo "::warning::Not every configured symbol has a validated M1 feed after 60s. This is reported, not blocking -- see m1_status below."
                curl --fail --silent --show-error http://127.0.0.1:8080/health | grep -o "\"m1_status\":{[^}]*}" || true
              fi

              echo "Independently checking provider cadence on the wire (informational, not a deploy gate)..."
              # /etc/pysgrid-forex/pysgrid-forex.env is root:root 600 (see
              # deploy/install.sh), so the ubuntu user cannot source it
              # directly -- sudo -n (passwordless) is required to read it,
              # same fix as an earlier probe needed (see git history).
              #
              # Known limitation: RealMarketAPI plans cap concurrent
              # WebSocket connections per key. The live service (already
              # running, one connection per symbol) and this probe (opening
              # its own set with the SAME key) compete for that same pool,
              # so this probe is expected to come back BLOCKED (exit 2)
              # whenever the service is already up -- that is a connection
              # -limit collision, not a cadence failure, and
              # verify_m1_provider.py distinguishes the two explicitly.
              if sudo -n bash -c '"'"'cd /opt/pysgrid-forex && set -a && . /etc/pysgrid-forex/pysgrid-forex.env && set +a && exec .venv/bin/python tools/verify_m1_provider.py --symbols "${PYSGRID_SYMBOLS:-XAUUSD,EURUSD,GBPUSD,USDJPY,GBPJPY,AUDUSD,USDCAD,NZDUSD,XAGUSD,USOIL}" --timeout 90'"'"'; then
                probe_exit=0
              else
                probe_exit=$?
              fi

              if [ "$probe_exit" -eq 0 ]; then
                echo "Provider probe confirmed a genuine 60s M1 cadence for every symbol."
              elif [ "$probe_exit" -eq 2 ]; then
                echo "::notice::Provider probe was inconclusive (WebSocket connection-limit contention with the live service, most likely) -- see output above. Not a cadence failure; expected while the service is already running under a limited-connection plan."
              else
                echo "::warning::Provider probe confirmed a non-60s cadence for at least one symbol -- see output above. This does not block the deploy."
              fi

              echo "=== DEPLOY SUMMARY ==="
              echo "Code deployed and service is up: YES"
              echo "All symbols currently validated M1: $m1_ok"
              echo "If M1 is not validated, this is a RealMarketAPI provider/plan issue, not a deploy failure -- see the warnings above."
            '
